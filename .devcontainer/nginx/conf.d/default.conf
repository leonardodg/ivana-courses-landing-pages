# ~/courses.ivana.academy/conf.d/default.conf

# ── Formulários: POST /api/contact → n8n (ver location = /api/contact) ──
# Rate limit no servidor (o do navegador é só UX). Chave = IP real do visitante (ver set_real_ip_from).
limit_req_zone $binary_remote_addr zone=contact:10m rate=10r/m;

# Só aceita POST vindo do próprio site (Origin). Navegadores sempre enviam Origin em POST com fetch.
# Não é autenticação (um script pode forjar Origin): é só mais uma barreira contra uso casual.
map $http_origin $contact_origin_ok {
    default 0;
    "https://courses.ivana.academy" 1;
    "~^http://(localhost|127\.0\.0\.1)(:[0-9]+)?$" 1;   # homologação por túnel SSH / testes locais
}

server {
    listen 8080;
    server_name _;

    # IP real do visitante: o Nginx do host (Cloudflare → host → container) repassa CF-Connecting-IP.
    # Só confiamos nesse header quando a conexão vem da rede do Docker/host. O container fica em 127.0.0.1.
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    set_real_ip_from 192.168.0.0/16;
    real_ip_header CF-Connecting-IP;
    
    root /usr/share/nginx/html;
    index index.html index.htm;

    # Charset
    charset utf-8;

    # Cabeçalhos de segurança (arquivo único, repetido nas locations com add_header)
    include /etc/nginx/snippets/security-headers.conf;

    # ── URLs antigas → novas (301). Padrão em docs/URLS.md: país e idioma no início do caminho. ──
    # Fica ANTES das regras de cache por extensão (a regra de .html capturaria /interest.html).
    absolute_redirect off;
    location ~ ^/pt_br/candles/?$ { return 301 /pt-br/cursos/velas/$is_args$args; }
    location ~ ^/pt_br/soap/?$ { return 301 /pt-br/cursos/sabonetes/$is_args$args; }
    location ~ ^/pt_br/aromas/?$ { return 301 /pt-br/cursos/aromas/$is_args$args; }
    location ~ ^/pt_br/resin/?$ { return 301 /pt-br/cursos/resinas/$is_args$args; }
    location ~ ^/velas/?$ { return 301 /pt-br/cursos/online/velas-aromaticas/$is_args$args; }
    location ~ ^/saboaria/?$ { return 301 /pt-br/cursos/online/saboaria-com-extratos-naturais/$is_args$args; }
    location ~ ^/apostila/?$ { return 301 /pt-br/apostilas/60-receitas-de-sabonetes/$is_args$args; }
    location ~ ^/agenda/?$ { return 301 /pt-br/agenda/$is_args$args; }
    location ~ ^/links/br/?$ { return 301 /pt-br/links/$is_args$args; }
    location ~ ^/links/arg/?$ { return 301 /es-ar/links/$is_args$args; }
    location ~ ^/es_ar/candles/?$ { return 301 /es-ar/carreras/tecnicatura-arte-diseno-velas/$is_args$args; }
    location ~ ^/es_ar/resin/?$ { return 301 /es-ar/carreras/tecnicatura-arte-decoracion-resinas/$is_args$args; }
    location ~ ^/es_ar/macrame/?$ { return 301 /es-ar/carreras/tecnicatura-macrame/$is_args$args; }
    location ~ ^/es_ar/textil/?$ { return 301 /es-ar/carreras/tecnicatura-estampas-textiles/$is_args$args; }
    location ~ ^/es_ar/interiores/?$ { return 301 /es-ar/carreras/tecnicatura-diseno-interiores/$is_args$args; }
    location ~ ^/es_ar/mixmedia/?$ { return 301 /es-ar/carreras/profesorado-arte-mix-media/$is_args$args; }
    location ~ ^/es_ar/agenda/?$ { return 301 /es-ar/agenda/$is_args$args; }
    location ~ ^/(interest|interest\.html)$ { return 301 /pt-br/interesse/$is_args$args; }
    location ~ ^/links/?$ { return 301 /pt-br/links/$is_args$args; }
    location ~ ^/pt_br/(privacidade|termos|reembolso|lgpd)/?$ { return 301 /pt-br/$1/$is_args$args; }
    location ~ ^/es_ar/(privacidad|terminos|reembolso|derechos|arrepentimiento)/?$ { return 301 /es-ar/$1/$is_args$args; }
    location ~ ^/pt_br/?$ { return 301 /pt-br/$is_args$args; }
    location ~ ^/es_ar/?$ { return 301 /es-ar/$is_args$args; }
    # Diretórios novos sem página própria
    location = /es-ar/carreras/ { return 301 /es-ar/#carreras; }
    location = /es-ar/carreras { return 301 /es-ar/#carreras; }
    location ~ ^/pt-br/cursos/?$ { return 301 /pt-br/#cursos; }
    location ~ ^/pt-br/cursos/online/?$ { return 301 /pt-br/#cursos; }
    location ~ ^/pt-br/apostilas/?$ { return 301 /pt-br/apostilas/60-receitas-de-sabonetes/; }

    # ── Envio dos formulários: o navegador chama esta rota SEM credencial; o Nginx acrescenta o
    # X-Webhook-Secret (lido do ambiente do container em runtime) e encaminha ao n8n pela rede interna.
    # O include é gerado por /docker-entrypoint.d/05-webhook-proxy.sh. O glob [f] faz o Nginx subir mesmo
    # sem o arquivo (ex.: devcontainer antigo): nesse caso a rota simplesmente não existe (404).
    location = /api/contact {
        limit_except POST { deny all; }
        if ($contact_origin_ok = 0) { return 403; }
        limit_req zone=contact burst=5 nodelay;
        limit_req_status 429;
        client_max_body_size 16k;
        client_body_buffer_size 16k;
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
        include /tmp/webhook-proxy.con[f];
    }

    # Cache-Control headers
    # HTML sempre revalidado: o navegador (inclusive o do Instagram) mostra a versão nova
    # logo após cada deploy. CSS, JS e imagens têm nome com hash e continuam em cache longo.
    location ~* \.(html)$ {
        expires -1;
    }

    location ~* \.(css|js)$ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    location ~* \.(jpg|jpeg|png|gif|ico|svg|webp|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        include /etc/nginx/snippets/security-headers.conf;
    }

    # Main location
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # 404 customizado
    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # Deny access to hidden files
    location ~ /\. {
        deny all;
    }

    # Health check
    location /health {
        access_log off;
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}
