# Cabeçalhos de segurança do site. Incluído no server e em CADA location que usa add_header
# (no Nginx, um add_header dentro de location anula os do server: por isso o include se repete).
# HSTS é enviado pelo Nginx do host (courses.conf), que termina o HTTPS.
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
