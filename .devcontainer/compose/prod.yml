# =============================================================================
# PRODUCTION - Optimized for production deployment
# =============================================================================
# Usage:
#     docker compose -f .devcontainer/compose/prod.yml up -d
# =============================================================================

services:
  web:
    build:
      context: ../../
      dockerfile: .devcontainer/build/nginx.Dockerfile
      target: production
      args:
        - VITE_TURNSTILE_SITE_KEY=${VITE_TURNSTILE_SITE_KEY:-}
        - VITE_GA_ID=${VITE_GA_ID:-}
        - VITE_TIENDA_AR_URL=${VITE_TIENDA_AR_URL:-}
    image: leodg/courses-landing-pages:main
    container_name: courses-nginx
    restart: unless-stopped
    environment:
      - APP_URL=https://courses.ivana.academy
      - APP_ENV=production
      - ENVIRONMENT=production
      # Só no ambiente do container em execução; o Nginx acrescenta ao encaminhar POST /api/contact ao n8n.
      - WEBHOOK_SECRET=${WEBHOOK_SECRET:?defina WEBHOOK_SECRET (segredo do webhook do n8n)}
      - N8N_WEBHOOK_UPSTREAM=${N8N_WEBHOOK_UPSTREAM:-http://n8n_main:5678/webhook/contact-v2}
    # Logs em stdout/stderr (docker logs courses-nginx). Porta só em 127.0.0.1: o Nginx do host é a entrada pública.
    ports:
      - "127.0.0.1:8088:8080"
    networks:
      - global-network
    read_only: true
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m,uid=101,gid=101
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    mem_limit: 128m
    cpus: 0.5
    pids_limit: 100

    ulimits:
      nofile:
        soft: 65536
        hard: 65536

networks:
  global-network:
    external: true