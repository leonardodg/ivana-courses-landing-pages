<script>
/* AGENDA: edite só esta lista (uma vez por mês). Datas passadas somem sozinhas.
   O primeiro evento futuro vira destaque; os 2 seguintes entram na lista.
   Fonte: ~/ivana-academy/kit-de-marca/brand/agenda.json (agenda da Ivana de 03/10/2026) */
const AGENDA = [
  { date: "2026-10-04", time: "14h",   title: "Macramé na Praia",         place: "Santo Antônio de Lisboa", free: true },
  { date: "2026-10-10", time: "",      title: "Saboaria e Velas",         place: "Balneário Camboriú" },
  { date: "2026-10-17", time: "",      title: "Velas Oratório",           place: "" },
  { date: "2026-10-24", time: "9h",    title: "Aromatizantes e Perfumes", place: "Ingleses, Florianópolis" },
  { date: "2026-10-24", time: "14h30", title: "Incensaria Natural",       place: "Ingleses, Florianópolis" },
  { date: "2026-10-31", time: "",      title: "Imersão de Velas",         place: "" }
];
const WA = "https://wa.me/5548991671659?text=";
const MESES = ["jan","fev","mar","abr","mai","jun","jul","ago","set","out","nov","dez"];
const SP = { timeZone: "America/Sao_Paulo" };
const today = new Date().toLocaleDateString("en-CA", SP);
const day = s => Date.UTC(...s.split("-").map((n, i) => i === 1 ? n - 1 : +n));
const next = AGENDA.filter(e => e.date >= today).slice(0, 3);

function el(tag, cls, text) { const n = document.createElement(tag); if (cls) n.className = cls; if (text) n.textContent = text; return n; }
function when(e) {
  const d = Math.round((day(e.date) - day(today)) / 864e5);
  return d === 0 ? "Hoje" : d === 1 ? "Amanhã" : "Em " + d + " dias";
}
function wa(e) {
  const [, m, d] = e.date.split("-");
  return WA + encodeURIComponent("Oi! Vim do Instagram e quero saber da oficina " + e.title + " (" + d + "/" + m + ").");
}

if (next.length) {
  const [first, ...rest] = next;
  const [, fm, fd] = first.date.split("-");

  const f = el("a", "feature"); f.href = wa(first);
  f.append(el("span", "when", when(first)));
  const t = el("h3", "", first.title); f.append(t);
  f.append(el("p", "", fd + " de " + ["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"][+fm - 1]
    + (first.time ? " · " + first.time : "") + " · " + first.place + (first.free ? " · grátis" : "")));
  const go = el("span", "go", "Quero minha vaga");
  go.insertAdjacentHTML("afterbegin", '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 21.35 10.55 20C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg>');
  f.append(go);
  document.getElementById("feature").append(f);

  const ul = document.getElementById("events");
  rest.forEach(e => {
    const [, m, d] = e.date.split("-");
    const li = el("li"); const a = el("a", "event"); a.href = wa(e);
    const dt = el("span", "date", String(+d)); dt.append(el("small", "", MESES[+m - 1]));
    const tx = el("span"); const ti = el("span", "ev-title", e.title);
    if (e.free) ti.append(el("span", "tag", "grátis"));
    tx.append(ti, el("span", "ev-meta", (e.time ? e.time + " · " : "") + e.place));
    a.append(dt, tx);
    a.insertAdjacentHTML("beforeend", '<svg class="chev" viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6 6 6-6 6"/></svg>');
    li.append(a); ul.append(li);
  });
  document.getElementById("agenda-more").href = WA + encodeURIComponent("Oi! Vim do Instagram e quero saber as próximas datas das oficinas.");
  document.getElementById("agenda").hidden = false;
}
</script>
